[workspace]
resolver = "2"
members = ["crates/aic-core", "crates/aic-sim", "crates/aic-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aic-core = { path = "crates/aic-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false, features = ["serde1"] }

[profile.release.package.aic-wasm]
opt-level = "s"
